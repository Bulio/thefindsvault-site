name: Controllo sito

# Gira a ogni push (cioe' a ogni deploy_site.sh) e una volta a settimana,
# cosi' una regressione salta fuori subito invece che tra due settimane.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # lunedi' 07:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrita' del sito
        run: python3 scripts/check_site.py
